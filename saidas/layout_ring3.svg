<text x="80" y="866.0" font-size="11" fill="#555">Serpenteado: 5 balizas de 1.40 m de largura × 27.0 m de profundidade, por corredor.</text>
<text x="80" y="883.0" font-size="11" fill="#555">Eixos dos corredores a 10.0 m entre si, coincidindo com as portas 2.7, 2.4, 2.1. Vão de egresso entre blocos: 3.0 m.</text>
<text x="80" y="900.0" font-size="11" fill="#555">Capacidade de projeto: 810 pessoas (0.50 m por pessoa) — 270 por corredor.</text>
<text x="80" y="917.0" font-size="11" fill="#555">Barreira: 573 m ≈ 286 separadores de 2 m (469 m nos blocos + 104 m em fundo, garganta e descarga).</text>
<text x="80" y="934.0" font-size="11" fill="#555">Portas medidas na página 2 de RDS_Hall_2_Floorplan_(1).pdf. A planta não usa rótulos S4/S5/S6 — confirmar a correspondência.</text>
<text x="80" y="951.0" font-size="11" fill="#555">Transladar o conjunto no eixo leste–oeste até os eixos coincidirem com as portas: medir em campo a distância do bordo oeste do Ring 3 ao canto sudoeste do Hall 2.</text>
