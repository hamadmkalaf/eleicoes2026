<text x="84" y="1086.0" font-size="11" fill="#555">Capacidade: 780 pessoas nos serpenteados (260 por corredor, a 0.50 m por pessoa) + ~490 na reserva de flanco.</text>
<text x="84" y="1103.0" font-size="11" fill="#555">Blocos a 9.0 m de eixo a eixo; portas S4/S5/S6 a 6.2 m. A baliza de saída de cada corredor caminha 0.0 m até S4, 2.8 m até S5, 0.0 m até S6 na faixa de descarga de 5 m.</text>
<text x="84" y="1120.0" font-size="11" fill="#555">Este quantitativo cobre SOMENTE o Ring 3. O interior do Hall 2 tem necessidade própria, ainda não dimensionada.</text>
<text x="84" y="1137.0" font-size="11" fill="#555">Posições das portas lidas na prancheta do Posto. Aferir em campo a distância do bordo oeste do Ring 3 ao canto sudoeste do Hall 2, que translada todo o conjunto.</text>
