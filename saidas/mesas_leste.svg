<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1428 626" style="width:100%;height:auto" role="img" aria-label="A parede leste nas tres leituras do recuo de 3 m"><rect x="0" y="0" width="1428" height="626" fill="#fbfaf7"/><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f6fb2" opacity=".6"/></marker><pattern id="hach" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#16867f" stroke-width="1" opacity=".35"/></pattern></defs><text x="28.0" y="28.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2c3c" text-anchor="start" font-weight="700">A PAREDE LESTE, DE PERTO</text><text x="28.0" y="46.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5c6c80" text-anchor="start">Os 44,40 m da fachada, nas três leituras do recuo de 3 m. As quatro saídas de emergência L1 a L4 estão em verde.</text><text x="28.0" y="60.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5c6c80" text-anchor="start">Um par de mesas ocupa 6,30 m de parede; uma MRV avulsa, 2,70 m.</text><text x="28.0" y="110.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2c3c" text-anchor="start" font-weight="600">recuo de 3 m dos dois lados</text><text x="28.0" y="124.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" fill="#5c6c80" text-anchor="start">o que o modelo aplica hoje</text><rect x="210.0" y="130.0" width="225.2" height="75.0" fill="url(#hach)" stroke="#16867f" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="505.0" y="130.0" width="226.8" height="75.0" fill="url(#hach)" stroke="#16867f" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="801.5" y="130.0" width="226.5" heig