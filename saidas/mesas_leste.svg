<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1256 686" style="width:100%;height:auto" role="img" aria-label="A fachada leste encostada e recuada"><rect x="0" y="0" width="1256" height="686" fill="#fbfaf7"/><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f6fb2" opacity=".6"/></marker><pattern id="hach" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#16867f" stroke-width="1" opacity=".35"/></pattern></defs><text x="28.0" y="30.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2c3c" text-anchor="start" font-weight="700">A FACHADA LESTE — ENCOSTADA OU RECUADA</text><text x="28.0" y="48.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#5c6c80" text-anchor="start">Os 44,40 m da fachada vistos de lado: a parede em cima, a profundidade do salão para baixo. As quatro saídas de emergência L1 a L4 estão em verde.</text><text x="28.0" y="64.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#5c6c80" text-anchor="start">O módulo tem 4,10 m de profundidade e 0,90 m de frente; um par ocupa 5,30 a 6,30 m de frente.</text><text x="28.0" y="130.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2c3c" text-anchor="start" font-weight="600">encostada na parede</text><text x="28.0" y="144.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5c6c80" text-anchor="start">com recuo de 3 m dos</text><text x="28.0" y="156.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5c6c80" text-anchor="start">dois lados de cada vão</text><rect x="208.0" y="150.0" width="189.2" height="63.0" fill="url(#hach)" stroke="#16867f" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="455.8" y="150.0" width="190.5" height="63.0" fill="url(#hach)" stroke="#16867f" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="704.9" y="150.0" width="190.3" height="63.0" fill="url(#hach)" stroke="#16867f" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="953.7" y="150.0" width="186.7" height="63.0" fill="url(#hach)" stroke="#16867f" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="397.2" y="200.4" width="18.9" height="35.7" fill="#3b4552" opacity=".45"/><circle cx="406.7" cy="178.3" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".45"/><circle cx="406.7" cy="159.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".45"/><rect x="646.3" y="200.4" width="18.9" height="35.7" fill="#3b4552" opacity=".45"/><circle cx="655.7" cy="178.3" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".45"/><circle cx="655.7" cy="159.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".45"/><rect x="895.1" y="200.4" width="18.9" height="35.7" fill="#3b4552" opacity=".45"/><circle cx="904.6" cy="178.3" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".45"/><circle cx="904.6" cy="159.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".45"/><line x1="208.0" y1="150.0" x2="1140.4" y2="150.0" stroke="#1c2733" stroke-width="3.4"/><line x1="269.9" y1="150.0" x2="334.2" y2="150.0" stroke="#16867f" stroke-width="5.4"/><line x1="518.8" y1="150.0" x2="583.3" y2="150.0" stroke="#16867f" stroke-width="5.4"/><line x1="767.9" y1="150.0" x2="832.1" y2="150.0" stroke="#16867f" stroke-width="5.4"/><line x1="1016.7" y1="150.0" x2="1081.0" y2="150.0" stroke="#16867f" stroke-width="5.4"/><text x="1152.4" y="156.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#5c6c80" text-anchor="start" font-weight="700">3 mesas</text><text x="208.0" y="257.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" fill="#5c6c80" text-anchor="start">Os envelopes de 3 m em volta dos quatro vãos deixam três trechos de 2,79 m. Não cabe par; cabe uma MRV sozinha em cada.</text><text x="28.0" y="356.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2c3c" text-anchor="start" font-weight="600">recuada 3 m da parede</text><text x="28.0" y="370.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5c6c80" text-anchor="start">faixa protegida contínua</text><text x="28.0" y="382.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5c6c80" text-anchor="start">ao longo de toda a fachada</text><rect x="208.0" y="376.0" width="932.4" height="63.0" fill="url(#hach)" stroke="#16867f" stroke-width="0.8" stroke-dasharray="4 3"/><rect x="271.0" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="280.4" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="280.4" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="346.0" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="355.4" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="355.4" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="385.9" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="395.3" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="395.3" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="460.8" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="470.3" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="470.3" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="500.7" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="510.2" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="510.2" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="575.7" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="585.2" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="585.2" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="615.6" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="625.1" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="625.1" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="690.6" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="700.0" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="700.0" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="730.5" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="739.9" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="739.9" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="805.4" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="814.9" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="814.9" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="845.3" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="854.8" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="854.8" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="920.3" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="929.8" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="929.8" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="960.2" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="969.7" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="969.7" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><rect x="1035.2" y="489.4" width="18.9" height="35.7" fill="#3b4552" opacity=".85"/><circle cx="1044.6" cy="467.4" r="9.5" fill="none" stroke="#1f6fb2" stroke-width="1.4" opacity=".85"/><circle cx="1044.6" cy="448.4" r="4.6" fill="none" stroke="#59616d" stroke-width="1" opacity=".85"/><line x1="208.0" y1="376.0" x2="1140.4" y2="376.0" stroke="#1c2733" stroke-width="3.4"/><line x1="269.9" y1="376.0" x2="334.2" y2="376.0" stroke="#16867f" stroke-width="5.4"/><line x1="518.8" y1="376.0" x2="583.3" y2="376.0" stroke="#16867f" stroke-width="5.4"/><line x1="767.9" y1="376.0" x2="832.1" y2="376.0" stroke="#16867f" stroke-width="5.4"/><line x1="1016.7" y1="376.0" x2="1081.0" y2="376.0" stroke="#16867f" stroke-width="5.4"/><text x="1152.4" y="382.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2c3c" text-anchor="start" font-weight="700">14 mesas</text><path d="M289.9 537.1L346.0 537.1" stroke="#1f6fb2" stroke-width="0.9" opacity=".8"/><line x1="289.9" y1="534.1" x2="289.9" y2="540.1" stroke="#1f6fb2" stroke-width="0.9" opacity=".8"/><line x1="346.0" y1="534.1" x2="346.0" y2="540.1" stroke="#1f6fb2" stroke-width="0.9" opacity=".8"/><text x="317.9" y="550.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#1f6fb2" text-anchor="middle">2,67 no par</text><path d="M364.9 537.1L385.9 537.1" stroke="#1f6fb2" stroke-width="0.9" opacity=".8"/><line x1="364.9" y1="534.1" x2="364.9" y2="540.1" stroke="#1f6fb2" stroke-width="0.9" opacity=".8"/><line x1="385.9" y1="534.1" x2="385.9" y2="540.1" stroke="#1f6fb2" stroke-width="0.9" opacity=".8"/><text x="375.4" y="563.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#1f6fb2" text-anchor="middle">1,00 entre pares</text><text x="208.0" y="585.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2c3c" text-anchor="start">A faixa de 3 m corre a fachada inteira e liga as quatro saídas: nada é montado nela e nenhuma fila se forma.</text><text x="208.0" y="599.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2c3c" text-anchor="start">Como a fileira não encosta na parede, os vãos deixam de recortá-la — 7 pares alinhados em 37,30 m.</text><text x="208.0" y="613.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5c6c80" text-anchor="start">A urna fica voltada para a fachada e o eleitor se põe entre ela e a faixa protegida: a tela aponta para a parede e não é vista do salão.</text><line x1="930.4" y1="94.0" x2="1140.4" y2="94.0" stroke="#5c6c80" stroke-width="1"/><line x1="930.4" y1="91.0" x2="930.4" y2="97.0" stroke="#5c6c80" stroke-width="1"/><line x1="1035.4" y1="91.0" x2="1035.4" y2="97.0" stroke="#5c6c80" stroke-width="1"/><line x1="1140.4" y1="91.0" x2="1140.4" y2="97.0" stroke="#5c6c80" stroke-width="1"/><text x="1152.4" y="97.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#5c6c80" text-anchor="start">10 m</text></svg>