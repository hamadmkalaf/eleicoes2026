<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 898 442" style="width:100%;height:auto" role="img" aria-label="As réguas de parede do cenário B"><rect x="0" y="0" width="898" height="442" fill="#fbfaf7"/><text x="24.0" y="26.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2c3c" text-anchor="start" font-weight="700">AS RÉGUAS DE PAREDE</text><text x="24.0" y="44.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5c6c80" text-anchor="start">Cada face na mesma escala. Um par exige de 5,30 a 6,30 m contínuos — por isso a soma dos pedaços não vira mesa.</text><text x="24.0" y="58.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5c6c80" text-anchor="start">A fachada leste não recebe módulo: é ela que carrega a faixa protegida. A fileira que vem depois dela é a linha seguinte.</text><text x="122.0" y="100.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#1f2c3c" text-anchor="end" font-weight="600">norte</text><rect x="132.0" y="88.0" width="674.0" height="17.0" fill="#fff" stroke="#5c6c80" stroke-width="0.7" opacity=".85"/><rect x="227.3" y="88.0" width="35.2" height="17.0" fill="#5d6773" opacity=".32"/><rect x="388.7" y="88.0" width="87.9" height="17.0" fill="#5d6773" opacity=".32"/><rect x="765.8" y="88.0" width="40.2" height="17.0" fill="#9a8b72" opacity=".32"/><rect x="802.0" y="88.0" width="4.0" height="17.0" fill="#9a8b72" opacity=".32"/><rect x="147.5" y="90.0" width="64.3" height="13.0" fill="#1f6fb2" opacity=".78"/><rect x="293.5" y="90.0" width="64.3" height="13.0" fill="#1f6fb2" opacity=".78"/><rect x="476.6" y="90.0" width="62.2" height="13.0" fill="#1f6fb2" opacity=".78"/><rect x="552.3" y="90.0" width="62.2" height="13.0" fill="#1f6fb2" opacity=".78"/><rect x="627.9" y="90.0" width="62.2" height="13.0" fill="#1f6fb2" opacity=".78"/><rect x="703.6"