<rect x="571.3" y="866.0" width="11" height="11" fill="#5d6773" opacity=".55" stroke="#5d6773"/>
<text x="587.3" y="875.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#243244">passagem de serviço: WC e Hall 1</text>
<text x="64" y="900.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#5c6c80">Contorno e vãos medidos da planta oficial do RDS e da versão revisada que assinala as duas portas de carga. Nenhuma mesa receptora está desenhada: o miolo do salão é o</text>
<text x="64" y="914.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#5c6c80">que as ideias 1 e 2 disputam. O recuo de 3 m aparece hachurado em todas as saídas de emergência — cheio na parede leste, onde a exigência foi confirmada, e pontilhado nas</text>
<text x="64" y="928.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#5c6c80">demais, onde ainda é pergunta em aberto. É essa dúvida que separa 55,7 m de parede livre de 74,9 m.</text>
</svg>