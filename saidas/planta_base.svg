<text x="152.0" y="17.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f2c3c" text-anchor="start">PLANTA-BASE — o salão e as portas numeradas</text>
<rect x="152" y="852.0" width="11" height="11" fill="#5d6773" opacity=".55" stroke="#5d6773"/>
<text x="168" y="861.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#243244">porta sem papel definido</text>
<rect x="305.2" y="852.0" width="11" height="11" fill="#b23b2e" opacity=".55" stroke="#b23b2e"/>
<text x="321.2" y="861.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#243244">porta fechada</text>
<rect x="400.09999999999997" y="852.0" width="11" height="11" fill="#1f6fb2" opacity=".55" stroke="#1f6fb2"/>
<text x="416.09999999999997" y="861.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#243244">porta desbloqueada · saída do catering</text>
<rect x="627.5" y="852.0" width="11" height="11" fill="#16867f" opacity=".55" stroke="#16867f"/>
<text x="643.5" y="861.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#243244">saída de emergência (recuo de 3 m onde determinado)</text>
<text x="152" y="886.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#5c6c80">As portas são numeradas por fachada, na ordem de leitura do desenho: de oeste para leste nas paredes norte e sul, de norte para sul nas paredes leste e oeste. Abaixo de cada</text>
<text x="152" y="900.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#5c6c80">número vem o código do RDS e a largura do vão. Nada aqui atribui entrada ou saída de eleitor — essa decisão vem depois. O recuo de 3 m está marcado só na parede leste, onde</text>
<text x="152" y="914.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#5c6c80">todas as portas são saídas de emergência; sobram dela 3 trechos de 2,79 m entre os recuos. As portas 2.8/2.9 ficam na parede do recorte, que não é fachada.</text>
<text x="152" y="928.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#5c6c80">S2 e S8 são saída de emergência sem código do RDS — não constavam na planta original, confirmadas no local: portas pretas de sinal verde encostadas às portas de carga. Ficam permanentemente</text>
<text x="152" y="942.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#5c6c80">abertas e por isso não pedem recuo; posição e vão são estimados até medir no local. Segue em aberto se S3 (2.7), S7 (2.1) e R1, as três saídas de emergência restantes, também dispensam — N1 não conta, já fechada.</text>
</svg>