<text x="418" y="370" font-size="11" fill="#5b6470" text-anchor="middle">1,50 m da mesa — zebrado preto-e-branco, sigilo do voto</text>
<text x="418" y="385" font-size="11" fill="#5b6470" text-anchor="middle">só passa quem o mesário chamar</text>
