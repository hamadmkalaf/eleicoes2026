<text x="104" y="46" font-size="22" font-weight="700" fill="#16202b">Do fim da barreira até a mesa — o ramal, em escala</text>
<text x="104" y="72" font-size="13" fill="#5b6470">Vale igual nas três paredes. Aqui a parede oeste: a mesa à esquerda, a avenida à direita, 11,00 m entre uma e outra.</text>
<text x="104" y="94" font-size="13" fill="#5b6470">A barreira pára na boca do ramal. Da boca até a mesa, quem manda é a fita — e é por isso que a linha de espera tem de ser inconfundível.</text>
