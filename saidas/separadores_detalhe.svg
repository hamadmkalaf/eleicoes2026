<text x="648" y="413" font-size="11" fill="#5b6470" text-anchor="middle">seções 3054 · 1099</text>
<text x="108" y="582" font-size="11.5" fill="#6b7686">Papel plastificado, colado FORA da linha de pisada. No meio do canal ele some sob os pés e sob o corpo de quem está na frente: serve para confirmar, nunca para decidir.</text>
<text x="108" y="600" font-size="11.5" fill="#6b7686">O número que decide vai no banner, à altura dos olhos — os banners já estão orçados (item c, EUR 1.961,00).</text>
