<text x="653" y="373" font-size="11" fill="#5b6470" text-anchor="middle">seções 513 · 1105</text>
<text x="104" y="544" font-size="11.5" fill="#6b7686">Papel plastificado, colado FORA da linha de pisada. No meio do canal ele some sob os pés e sob o corpo de quem está na frente: serve para confirmar, nunca para decidir.</text>
<text x="104" y="562" font-size="11.5" fill="#6b7686">O número que decide vai no banner, à altura dos olhos — os banners já estão orçados (item c, EUR 1.961,00).</text>
